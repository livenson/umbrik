[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "umbrik"
description = "CDOC2 encrypted container format: read and write Estonian .cdoc2 files"
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Ilja Livenson" }]
# 3.9 reached end of life in October 2025 and receives no security fixes; a cryptographic
# library should not invite its use. 3.10 is the oldest version still supported upstream.
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/livenson/umbrik"

[tool.maturin]
manifest-path = "Cargo.toml"
# The stable ABI: one wheel serves every supported interpreter.
features = ["extension-module", "pyo3/abi3-py310"]
strip = true
