name: Python

# Builds, tests and publishes the Python wheels.
#
# Wheels use PyO3's stable ABI (abi3-py310), so there is one wheel per *platform*, not per
# interpreter version, and it keeps working on Python versions released after it was built. The
# test matrix below is what proves that claim rather than assuming it: a single wheel is
# installed and exercised on every supported CPython.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64,  manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos-latest,     target: aarch64, manylinux: "off" }
          - { os: macos-15-intel,   target: x86_64,  manylinux: "off" }
          - { os: windows-latest,   target: x86_64,  manylinux: "off" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Linux builds inside the manylinux container and installs flatc there instead, via
      # before-script-linux below. macOS and Windows build on the runner itself.
      #
      # scripts/install-flatc.sh rather than brew or choco: it reads the version from Cargo.toml,
      # so it cannot drift from the `flatbuffers` crate. A mismatch generates code that does not
      # compile, and a distribution package is whatever version it happens to be that week.
      - name: Install flatc
        if: runner.os != 'Linux'
        shell: bash
        run: |
          scripts/install-flatc.sh
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
        env:
          FLATC_BIN_DIR: ${{ runner.temp }}/bin

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: bindings/python
          args: --release --out dist
          # umbrik generates its FlatBuffers codec at build time, and the manylinux image has
          # no flatc package. Building it from source keeps the wheel manylinux-compliant,
          # which a wheel built on the bare runner would not be. Pinned to the version matching
          # the `flatbuffers` crate — a mismatch produces code that will not compile.
          before-script-linux: |
            set -eux
            FLATC_VERSION=25.12.19
            if command -v yum >/dev/null; then yum install -y cmake gcc-c++ make git; fi
            git clone --depth 1 --branch "v${FLATC_VERSION}" \
              https://github.com/google/flatbuffers.git /tmp/flatbuffers
            cmake -S /tmp/flatbuffers -B /tmp/flatbuffers/build \
              -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF
            cmake --build /tmp/flatbuffers/build --target flatc -j"$(nproc)"
            cp /tmp/flatbuffers/build/flatc /usr/local/bin/flatc
            flatc --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  # The point of abi3: one wheel, every supported interpreter. Verified, not assumed.
  #
  # Linux carries the full interpreter sweep. Windows runs one version, because what is in doubt
  # there is the platform rather than the ABI — umbrik-python is not a default workspace member,
  # so a plain `cargo build` on the Windows CI job never compiles it, and this is the only thing
  # that exercises the binding on Windows at all.
  test:
    name: Test wheel on ${{ matrix.os }} Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every CPython still receiving upstream support. 3.9 reached end of life in
        # October 2025 and is deliberately excluded.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - { os: windows-latest, python: "3.10" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.os }}-x86_64
          path: dist

      - name: Install the wheel and run the tests
        # bash on the Windows runner too: PowerShell does not expand the wheel glob.
        shell: bash
        run: |
          # pytest and its dependencies are pinned by hash (Scorecard's Pinned-Dependencies
          # check), so a compromised index cannot substitute a package into the test run. The
          # pip shipped with setup-python is used as is: upgrading it would be one more
          # unpinned download, and installing a wheel needs nothing newer.
          python -m pip install --require-hashes -r bindings/python/requirements-test.txt
          # The same cp310-abi3 wheel is installed on every version in the matrix.
          python -m pip install dist/*.whl
          python -c "import umbrik; print('umbrik', umbrik.__version__, 'on', __import__('sys').version)"
          python -m pytest bindings/python/tests -q

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          working-directory: bindings/python
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  # Wheels and the sdist are attached to the GitHub release. This is the distribution channel
  # until a PyPI trusted publisher is configured.
  attach:
    name: Attach wheels to the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, test, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      # To watch release.yml's run.
      actions: read
    env:
      # This job does not check out the repository, so gh cannot infer which repo it is acting
      # on and every `gh release` call fails regardless of whether the release exists.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # release.yml creates the release from the same tag, then uploads the binaries and
      # SHA256SUMS. Waiting for the release to *exist* is not enough: it exists a few seconds
      # before SHA256SUMS does, and a poll landing in that window fails the download below.
      # Waiting for that workflow's run to finish removes any reasoning about upload order.
      # Seven targets take around twelve minutes; allow well past that.
      - name: Wait for the release workflow
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh run list --workflow release.yml --branch "$GITHUB_REF_NAME" --event push \
                      --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "release workflow finished with $state" >&2; exit 1 ;;
            esac
            echo "release workflow is ${state:-not started} (attempt $attempt of 60)"
            sleep 30
          done
          echo "release workflow did not finish within 30 minutes" >&2
          exit 1

      - name: Attach to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

          # SHA256SUMS was written by release.yml before these wheels existed, so extend it
          # rather than leaving half the assets uncovered.
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D sums --clobber
          (cd dist && sha256sum ./*) | sed 's|\./||' >> sums/SHA256SUMS
          sort -u -k2 sums/SHA256SUMS -o sums/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" sums/SHA256SUMS --clobber

  # Off until a trusted publisher exists. Set the repository variable PUBLISH_TO_PYPI to 'true'
  # to enable it; nothing else needs to change.
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [wheels, test, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/umbrik
    permissions:
      # Trusted publishing exchanges a short-lived OIDC token for a 15-minute PyPI token, so
      # there is no long-lived credential to store or leak.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # PEP 740 attestations travel with the package on the index.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1cd9f6d92d1ac9b6394d3ce0a92bf3 # release/v1
        with:
          packages-dir: dist
          attestations: true
          print-hash: true
