name: CodeQL

# Semantic analysis for Rust — generally available since October 2025. It looks for a different
# class of problem than clippy: cryptographic misuse, injection, unsafe handling of untrusted
# data. That overlaps exactly with umbrik's attack surface, where container bytes are attacker
# controlled and parsed before anything is authenticated.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code rather than only new commits.
    - cron: "27 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          scripts/install-flatc.sh

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust
          # Query selection and the one documented exclusion live here, with the reasoning.
          config-file: .github/codeql/config.yml

      - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
