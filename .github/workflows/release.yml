name: Release

# Builds release binaries, generates an SBOM, and signs both with GitHub Artifact Attestations.
#
# Attestations bind each artifact's SHA-256 digest to the workflow, repository and commit that
# produced it, signed through Sigstore with a short-lived certificate. There is no long-lived
# signing key to store or leak. A consumer verifies with:
#
#   gh attestation verify ./umbrik --repo livenson/umbrik
#
# For an unaudited cryptographic tool this matters more than usual: it lets someone confirm the
# binary they downloaded came from the source they can read, and not from somewhere else.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc and macOS builds carry the full feature set, including the eID directory
          # lookup, which needs OpenSSL for a TLS suite rustls will not offer.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   features: default }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  features: default }
          - { os: macos-latest,     target: aarch64-apple-darwin,       features: default }
          - { os: macos-15-intel, target: x86_64-apple-darwin,        features: default }
          # Windows uses schannel for TLS, so no OpenSSL is needed.
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     features: default }
          # musl builds are fully static and run anywhere, including scratch containers, at the
          # cost of the directory lookup: linking OpenSSL statically against musl is a great
          # deal of trouble for one feature. `--no-default-features` also makes these binaries
          # incapable of any network access, which is the right default for an air-gapped or
          # locked-down environment.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  features: none }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, features: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config musl-tools
          scripts/install-flatc.sh

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: scripts/install-flatc.sh

      # No flatc package on the Windows runners; the project publishes an official binary.
      # Pinned to the version matching the `flatbuffers` crate — a mismatch generates code that
      # will not compile.
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "25.12.19"
          Invoke-WebRequest -Uri "https://github.com/google/flatbuffers/releases/download/v$version/Windows.flatc.binary.zip" -OutFile flatc.zip
          Expand-Archive flatc.zip -DestinationPath "$env:RUNNER_TEMP\flatc"
          "$env:RUNNER_TEMP\flatc" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "none" ]; then
            cargo build --release --target ${{ matrix.target }} -p umbrik-cli --no-default-features
          else
            cargo build --release --target ${{ matrix.target }} -p umbrik-cli
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/umbrik.exe" "dist/umbrik-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/umbrik" "dist/umbrik-${{ matrix.target }}"
          fi

      # A binary that cannot run is worse than no binary. Native targets are smoke-tested here;
      # cross-built ones cannot be, and are covered by the test suite on their own architecture.
      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/umbrik-${{ matrix.target }}"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" encrypt --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrik-${{ matrix.target }}
          path: dist/umbrik-${{ matrix.target }}*
          if-no-files-found: error

  attest:
    name: SBOM and attestations
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # attach artifacts to the release
      id-token: write     # mint the OIDC token Sigstore signs against
      attestations: write # persist the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          scripts/install-flatc.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # CycloneDX rather than SPDX: it records the exact resolved versions from Cargo.lock,
      # which is what someone auditing a cryptographic dependency actually needs.
      # cargo-cyclonedx writes one SBOM per crate. The released artifact is the CLI binary, so
      # its SBOM is the one that describes what is actually shipped — it transitively covers
      # umbrik-core, umbrik-ldap and umbrik-pkcs11.
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all --override-filename umbrik-sbom
          cp crates/umbrik-cli/umbrik-sbom.json dist/umbrik-sbom.json
          python3 -c "import json,sys; d=json.load(open('dist/umbrik-sbom.json')); print(f\"SBOM: {len(d['components'])} components\")"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/umbrik-*"

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/umbrik-x86_64-unknown-linux-gnu"
          sbom-path: dist/umbrik-sbom.json

      # Checksums let someone verify a download without the GitHub CLI. Attestations are the
      # stronger check, but they require tooling the recipient may not have.
      - name: Checksums
        run: |
          cd dist
          sha256sum umbrik-* > SHA256SUMS
          cat SHA256SUMS

      # The changelog section for this version becomes the release notes, so the notes and
      # CHANGELOG.md cannot drift apart.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text, re.S | re.M)
          print(match.group(1).strip() if match else f"Release {version}.")
          PY
          cat >> release-notes.md <<'EOF'

          ---

          ### Verifying

          Every artifact is signed with GitHub Artifact Attestations, binding it to the workflow
          run and commit that produced it:

          ```bash
          gh attestation verify ./umbrik-x86_64-unknown-linux-gnu --repo livenson/umbrik
          ```

          `SHA256SUMS` covers every asset. `umbrik-sbom.json` is a CycloneDX SBOM of the
          resolved dependency graph.

          ### Which binary

          | File | Notes |
          |---|---|
          | `*-unknown-linux-gnu` | glibc, full features |
          | `*-unknown-linux-musl` | static, no network features |
          | `*-apple-darwin` | macOS |
          | `*-pc-windows-msvc.exe` | Windows |
          | `*.whl`, `*.tar.gz` | Python 3.10+, one wheel per platform |
          EOF

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-release versions (0.2.0-rc.1) are marked as such so they are not served as the
          # latest release.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "umbrik $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
