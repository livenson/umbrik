name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Actions are pinned to commit SHAs, not tags. A tag is mutable: force-pushing it to malicious
# code would run that code with whatever permissions the job holds, which is how the tj-actions
# compromise worked. The trailing comment keeps the version readable and lets Dependabot update
# the pin and the comment together.
#
# Deny by default; each job requests only what it needs. A workflow token with write access it
# never uses is a standing risk, and OpenSSF Scorecard flags it.
permissions: {}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # umbrik generates its FlatBuffers codec at build time. The flatc version must match the
      # `flatbuffers` crate version pinned in Cargo.toml.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libssl-dev is for native-tls, which umbrik-ldap needs because the SK directory
          # negotiates a cipher suite rustls will not offer. softhsm2 and opensc give a
          # software PKCS#11 token, so the card path is tested without hardware.
          sudo apt-get install -y libssl-dev pkg-config softhsm2 opensc
          # Not the distribution's flatbuffers-compiler: it lags the pinned crate, and a
          # mismatch generates code that will not compile.
          scripts/install-flatc.sh

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features

      # Prepare a SoftHSM token so the PKCS#11 tests run for real rather than skipping.
      # Without this they skip silently, which would hide a regression.
      - name: Prepare SoftHSM token
        run: |
          eval "$(crates/umbrik-pkcs11/tests/setup-softhsm.sh)"
          {
            echo "SOFTHSM2_CONF=$SOFTHSM2_CONF"
            echo "UMBRIK_PKCS11_MODULE=$UMBRIK_PKCS11_MODULE"
            echo "UMBRIK_PKCS11_PIN=$UMBRIK_PKCS11_PIN"
          } >> "$GITHUB_ENV"

      - name: Confirm the PKCS#11 tests are not skipping
        run: |
          test -n "$UMBRIK_PKCS11_MODULE" || { echo "SoftHSM setup did not export a module"; exit 1; }

      - run: cargo test --all-features
      - run: cargo test --release --all-features
      # The network-free build must keep working: it is what someone deploys when the tool
      # must not reach out to a directory.
      - run: cargo build -p umbrik-cli --no-default-features
      - run: cargo clippy -p umbrik-cli --no-default-features --all-targets

  interop:
    name: Interop against cdoc2-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          scripts/install-flatc.sh

      # Runners are x86_64, so no emulation is needed for the reference build.
      - name: Round-trip both directions
        env:
          UMBRIK_INTEROP_PLATFORM: linux/amd64
        run: tests/interop/run.sh

  # Runs the README's own install block on a clean runner. Documentation that tells people to
  # install a distribution flatc, for instance, produces a build failure they cannot diagnose —
  # this catches that the same day it is written rather than when someone reports it.
  install-docs:
    name: README install instructions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Extract the documented steps
        run: |
          python3 - <<'PY' > /tmp/install.sh
          import re
          text = open("README.md").read()
          block = re.search(r"<!-- ci:install-linux -->\s*```bash\n(.*?)```", text, re.S)
          assert block, "README.md has no <!-- ci:install-linux --> bash block"
          print("set -euxo pipefail")
          print(block.group(1))
          PY
          cat /tmp/install.sh

      - name: Run them exactly as written
        run: bash /tmp/install.sh

      - name: The result must actually work
        run: ./target/release/umbrik --version

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources

  dependency-review:
    name: Dependency review
    # Blocks a pull request that introduces a dependency with a known vulnerability or a
    # disallowed licence, before it is merged rather than after.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: low
          comment-summary-in-pr: always
          # Mirrors deny.toml. Copyleft in the linked graph is the rule that matters: see the
          # note there about PKCS#11 modules, which are loaded at runtime and not linked.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-3-Clause, ISC, Unicode-3.0, Zlib, 0BSD, Unlicense
