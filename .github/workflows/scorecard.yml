name: Scorecard

# OpenSSF Scorecard audits the repository's own security posture — branch protection, token
# permissions, pinned actions, whether releases are signed — rather than the code. Results land
# in the code-scanning dashboard alongside CodeQL.
on:
  branch_protection_rule:
  schedule:
    - cron: "31 5 * * 2"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
