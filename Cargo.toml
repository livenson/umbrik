[workspace]
resolver = "2"
members = [
    "crates/umbrik-core",
    "crates/umbrik-ldap",
    "crates/umbrik-pkcs11",
    "crates/umbrik-cli",
    "bindings/python",
]
# The Python bindings are in the workspace so they share the lockfile and inherited metadata,
# but out of the default set: building them requires a Python interpreter at or above the abi3
# floor (3.10), and a plain `cargo build` for the CLI or library should not need Python at all.
# Build them explicitly with `cargo build -p umbrik-python`, or through maturin.
default-members = [
    "crates/umbrik-core",
    "crates/umbrik-ldap",
    "crates/umbrik-pkcs11",
    "crates/umbrik-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/livenson/umbrik"
authors = ["Ilja Livenson"]

[workspace.dependencies]
flatbuffers = "=25.12.19"
hkdf = "=0.13.0"
sha2 = "=0.11.0"
sha1 = "=0.11.0"
hmac = "=0.13.0"
chacha20poly1305 = "=0.11.0"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
subtle = "=2.6.1"
thiserror = "=2.0.20"
rand_core = "=0.10.1"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
clap = { version = "=4.6.6", features = ["derive"] }
anyhow = "=1.0.104"
rpassword = "=7.5.4"
rand = "=0.10.2"
p384 = { version = "=0.14.0", default-features = false, features = ["ecdh", "pem", "std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "pem", "std"] }
x509-cert = { version = "=0.3.0", features = ["pem"] }
cryptoki = "=0.12.0"
# abi3-py310: one wheel per platform covering every supported CPython (3.10 onward),
# rather than a wheel per interpreter version. See bindings/python/README.md.
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
# native-tls, NOT rustls. esteid.ldap.sk.ee negotiates TLS 1.2 with AES256-GCM-SHA384, a static
# RSA key-exchange suite with no forward secrecy that rustls deliberately does not implement, so
# a rustls build cannot connect to it at all — and that directory holds the ID-card certificates.
# See crates/umbrik-ldap/src/lib.rs. Do not "modernise" this back to rustls.
ldap3 = { version = "=0.12.1", default-features = false, features = ["sync", "tls-native"] }

[profile.release]
overflow-checks = true
