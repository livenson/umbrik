[workspace]
resolver = "2"
members = [
    "crates/umbrik-core",
    "crates/umbrik-ldap",
    "crates/umbrik-pkcs11",
    "crates/umbrik-cli",
    "bindings/python",
]
# The Python bindings are in the workspace so they share the lockfile and inherited metadata,
# but out of the default set: building them requires a Python interpreter at or above the abi3
# floor (3.10), and a plain `cargo build` for the CLI or library should not need Python at all.
# Build them explicitly with `cargo build -p umbrik-python`, or through maturin.
default-members = [
    "crates/umbrik-core",
    "crates/umbrik-ldap",
    "crates/umbrik-pkcs11",
    "crates/umbrik-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/livenson/umbrik"
authors = ["Ilja Livenson"]

[workspace.dependencies]
flatbuffers = "=25.12.19"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
sha1 = "=0.11.0"
hmac = "=0.13.0"
chacha20poly1305 = "=0.11.0"
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }
subtle = "=2.6.1"
thiserror = "=2.0.21"
rand_core = "=0.10.1"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
tar = "=0.4.46"
flate2 = "=1.1.11"
clap = { version = "=4.6.8", features = ["derive"] }
anyhow = "=1.0.104"
rpassword = "=7.5.5"
rand = "=0.10.4"
p384 = { version = "=0.14.0", default-features = false, features = ["ecdh", "pem", "std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "pem", "std"] }
x509-cert = { version = "=0.3.0", features = ["pem"] }
cryptoki = "=0.12.1"
# abi3-py310: one wheel per platform covering every supported CPython (3.10 onward),
# rather than a wheel per interpreter version. See bindings/python/README.md.
pyo3 = { version = "=0.29.3", features = ["abi3-py310"] }
# rustls with the ring provider: no OpenSSL at build or run time. Both directories offer
# TLS 1.3 and ECDHE on TLS 1.2. (SK once offered only static-RSA suites, which rustls does not
# implement; that is why this used to be native-tls.) umbrik-ldap builds its own ClientConfig, so
# loading the system roots is under its control.
ldap3 = { version = "=0.12.1", default-features = false, features = ["sync", "tls-rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"

[profile.release]
overflow-checks = true
